<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="keywords" content="Like_Girl 克隆,情侣小站,React 情侣网站,情侣记录" />
    <meta name="description" content="爱晨雾漫过青瓦，爱暮色染透篱笆，更爱与君并肩立，看遍这人间烟火里的朝暮与年华。" />
    <title>Like_Girl v5.2.1 · Clone</title>
    <!-- 字体：改用 Google Fonts 中国镜像（fonts.googleapis.cn），国内可直连；
         并用 media="print" onload 技巧改成「非渲染阻塞」——字体没就绪时先用系统衬线字体显示，
         加载完成后自动替换，彻底避免白屏/卡顿 -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;700&family=Pacifico&family=Concert+One&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;700&family=Pacifico&family=Concert+One&display=swap"
      />
    </noscript>
    <!-- 尽早设置 data-theme，避免深色模式保存后首屏闪烁 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lovey-settings-v1')
          var mode = raw ? (JSON.parse(raw).theme === 'dark' ? 'dark' : 'light') : 'light'
          document.documentElement.setAttribute('data-theme', mode)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
